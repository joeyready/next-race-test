# .github/workflows/smoke-tests.yml
name: Smoke tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * *" # 13:00 UTC daily
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - run: python -m pip install -r tests/requirements.txt

      - run: playwright install --with-deps chromium

      - run: pytest tests/test_smoke.py --tracing=retain-on-failure

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

      # Only notify Slack for scheduled/manual runs, not every push or PR
      - uses: slackapi/slack-github-action@v2.0.0
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && '✅' || '❌' }} nextrace.live smoke tests: *${{ job.status }}* (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>)"